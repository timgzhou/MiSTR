[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mistr"
version = "0.1.0"
description = "MiSTR: adaptively mixing spatiotemporal resolution for satellite image time series"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "olmoearth-pretrain==0.1.2",
    "einops",
    "numpy",
    "safetensors",
    "huggingface_hub",
]

[project.optional-dependencies]
# varlen FlashAttention 2 (Ampere or newer GPUs): used automatically when installed, as in the
# paper; without it the model runs on PyTorch's attention. Prebuilt wheels match a torch / CUDA /
# Python combination; see README.
flash = ["flash-attn>=2.6"]

[tool.setuptools]
packages = ["mistr"]
